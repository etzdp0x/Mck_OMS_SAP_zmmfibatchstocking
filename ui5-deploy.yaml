# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: z.fi.batchstocking.zmmfibatchstocking
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: ABAP-RD3300-HTTP
          url: http://bastord3.rise.sap.mckesson.com:9000
          client: '300'
        app:
          name: ZFI_BATCHSTOCK
          package: ZPTP
          transport: RD3K900697
        exclude:
          - /test/
          - /localService/
